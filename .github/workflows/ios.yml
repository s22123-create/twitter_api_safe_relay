name: iOS client

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-simulator-smoke-test:
    name: Build and simulator smoke test
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/XRelayClient.xcodeproj \
            -scheme XRelayClient \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Boot simulator and launch app
        run: |
          set -euo pipefail
          device_udid="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')"
          test -n "$device_udid"
          xcrun simctl boot "$device_udid" 2>/dev/null || true
          xcrun simctl bootstatus "$device_udid" -b
          app_path="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/XRelayClient.app"
          xcrun simctl install "$device_udid" "$app_path"
          xcrun simctl launch "$device_udid" com.example.XRelayClient
          xcrun simctl spawn "$device_udid" launchctl print "gui/$(id -u)/com.example.XRelayClient" >/dev/null

      - name: Collect simulator diagnostics
        if: always()
        run: |
          xcrun simctl list devices
          xcrun simctl diagnose --output "$RUNNER_TEMP/simctl-diagnose" || true
